
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Renda na Prática</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f8fafc;font-family:Arial,sans-serif;padding:18px}
main{max-width:850px;margin:auto}
h1{color:#facc15}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px;margin:16px 0}
label{display:block;margin-top:12px}
input,textarea,select{display:block;width:100%;margin-top:6px;padding:12px;border-radius:7px;border:1px solid #64748b;font-size:16px}
button{padding:11px 14px;margin:8px 5px 0 0;border:0;border-radius:7px;background:#facc15;color:#111827;font-weight:bold;cursor:pointer}
button.danger{background:#f87171}
button.secondary{background:#cbd5e1}
.item{padding:14px 0;border-bottom:1px solid #475569;overflow-wrap:anywhere}
small,.muted{color:#cbd5e1}
.hidden{display:none!important}
a{color:#fde68a}
#msg{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Renda na Prática</h1>
<p class="muted">Painel administrativo</p>

<section id="login" class="card">
<h2>Entrar</h2>
<form id="loginForm">
<label>E-mail</label>
<input id="email" type="email" autocomplete="username" required>
<label>Senha</label>
<input id="senha" type="password" autocomplete="current-password" required>
<button id="loginBtn">Entrar</button>
</form>
</section>

<section id="painel" class="hidden">
<div class="card">
<h2>Gerenciar links</h2>
<p class="muted">Cadastre links de afiliados e escolha a categoria.</p>
<form id="linkForm">
<input type="hidden" id="linkId">
<label>Título</label>
<input id="titulo" maxlength="120" required>
<label>Descrição</label>
<textarea id="descricao" rows="3" maxlength="1000"></textarea>
<label>URL do link</label>
<input id="url" type="url" placeholder="https://..." required>
<label>Categoria</label>
<select id="categoria">
<option>Renda extra</option>
<option>Afiliados</option>
<option>Trabalho online</option>
<option>Ferramentas</option>
<option>Educação</option>
<option>Outros</option>
</select>
<label><input id="ativo" type="checkbox" checked style="display:inline;width:auto"> Link ativo e visível no site</label>
<button id="salvarBtn">Cadastrar link</button>
<button type="button" id="cancelarBtn" class="secondary hidden">Cancelar edição</button>
</form>
</div>

<div class="card">
<h2>Links cadastrados</h2>
<button id="atualizarBtn" class="secondary">Atualizar lista</button>
<div id="lista"></div>
</div>
<button id="sairBtn" class="secondary">Sair</button>
</section>

<p id="msg" role="status" aria-live="polite"></p>
<p><a href="./index.html">Voltar ao site</a></p>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const URL_PROJETO='https://fojqtnppgqibgmngeyxd.supabase.co';
const CHAVE_PUBLICA='sb_publishable__C2KwgOSgvhapX_Ig68GDQ_Qg4aWU6w';
const EMAIL_ADMIN='Amoresdopapaizinho@gmail.com';
const db=createClient(URL_PROJETO,CHAVE_PUBLICA);

const $=id=>document.getElementById(id);
const msg=t=>{$('msg').textContent=t};
const login=$('login'), painel=$('painel');
let editando=false;

function mostrarPainel(ativo){
 login.classList.toggle('hidden',ativo);
 painel.classList.toggle('hidden',!ativo);
}

async function verificarSessao(){
 const {data,error}=await db.auth.getSession();
 if(error){msg('Erro ao verificar a sessão.');return}
 const user=data.session?.user;
 if(user && user.email?.toLowerCase()===EMAIL_ADMIN.toLowerCase()){
   mostrarPainel(true);
   await carregarLinks();
 }else{
   mostrarPainel(false);
   if(user) await db.auth.signOut();
 }
}

$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 $('loginBtn').disabled=true;
 msg('Verificando acesso...');
 try{
  const {data,error}=await db.auth.signInWithPassword({
   email:$('email').value.trim(),
   password:$('senha').value
  });
  if(error) throw error;
  if(data.user?.email?.toLowerCase()!==EMAIL_ADMIN.toLowerCase()){
   await db.auth.signOut();
   throw new Error('Esta conta não é a conta autorizada.');
  }
  mostrarPainel(true);
  msg('Login realizado com sucesso.');
  await carregarLinks();
 }catch(e){
  msg(e.message==='Esta conta não é a conta autorizada.'
   ?e.message:'Não foi possível entrar. Confira o e-mail e a senha.');
 }finally{$('loginBtn').disabled=false}
});

async function carregarLinks(){
 $('lista').textContent='Carregando links...';
 const {data,error}=await db.from('links')
  .select('*').order('created_at',{ascending:false});
 if(error){
  $('lista').textContent='Erro ao carregar links: '+error.message;
  return;
 }
 $('lista').replaceChildren();
 if(!data.length){
  $('lista').textContent='Nenhum link cadastrado ainda.';
  return;
 }
 data.forEach(link=>{
  const item=document.createElement('div');
  item.className='item';
  const titulo=document.createElement('strong');
  titulo.textContent=link.titulo;
  const info=document.createElement('p');
  info.textContent=(link.categoria||'Outros')+' · '+(link.ativo?'Ativo':'Desativado');
  const descricao=document.createElement('p');
  descricao.textContent=link.descricao||'Sem descrição';
  const abrir=document.createElement('a');
  abrir.href=link.url; abrir.target='_blank'; abrir.rel='noopener noreferrer';
  abrir.textContent='Abrir link';
  const editar=document.createElement('button');
  editar.textContent='Editar';
  editar.onclick=()=>prepararEdicao(link);
  const alternar=document.createElement('button');
  alternar.className='secondary';
  alternar.textContent=link.ativo?'Desativar':'Ativar';
  alternar.onclick=()=>alternarAtivo(link);
  const excluir=document.createElement('button');
  excluir.className='danger'; excluir.textContent='Excluir';
  excluir.onclick=()=>excluirLink(link);
  item.append(titulo,info,descricao,abrir,document.createElement('br'),editar,alternar,excluir);
  $('lista').append(item);
 });
}

function prepararEdicao(link){
 editando=true;
 $('linkId').value=link.id;
 $('titulo').value=link.titulo;
 $('descricao').value=link.descricao||'';
 $('url').value=link.url;
 $('categoria').value=link.categoria||'Outros';
 $('ativo').checked=link.ativo;
 $('salvarBtn').textContent='Salvar alterações';
 $('cancelarBtn').classList.remove('hidden');
 window.scrollTo({top:0,behavior:'smooth'});
}

function limparFormulario(){
 editando=false;
 $('linkForm').reset();
 $('linkId').value='';
 $('ativo').checked=true;
 $('salvarBtn').textContent='Cadastrar link';
 $('cancelarBtn').classList.add('hidden');
}

$('cancelarBtn').onclick=limparFormulario;

$('linkForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const titulo=$('titulo').value.trim();
 const url=$('url').value.trim();
 if(!/^https?:\/\//i.test(url)){
  msg('Informe um link que comece com https:// ou http://');
  return;
 }
 const registro={
  titulo,
  descricao:$('descricao').value.trim(),
  url,
  categoria:$('categoria').value,
  ativo:$('ativo').checked
 };
 $('salvarBtn').disabled=true;
 try{
  let resultado;
  if(editando){
   resultado=await db.from('links').update(registro).eq('id',$('linkId').value);
  }else{
   resultado=await db.from('links').insert(registro);
  }
  if(resultado.error) throw resultado.error;
  msg(editando?'Link atualizado!':'Link cadastrado!');
  limparFormulario();
  await carregarLinks();
 }catch(e){
  msg('Não foi possível salvar. Verifique as permissões do Supabase. '+e.message);
 }finally{$('salvarBtn').disabled=false}
});

async function alternarAtivo(link){
 const {error}=await db.from('links').update({ativo:!link.ativo}).eq('id',link.id);
 if(error){msg('Erro ao alterar o link: '+error.message);return}
 msg('Estado do link atualizado.');
 await carregarLinks();
}

async function excluirLink(link){
 if(!confirm('Deseja realmente excluir "'+link.titulo+'"?')) return;
 const {error}=await db.from('links').delete().eq('id',link.id);
 if(error){msg('Erro ao excluir: '+error.message);return}
 msg('Link excluído.');
 await carregarLinks();
}

$('atualizarBtn').onclick=carregarLinks;
$('sairBtn').onclick=async()=>{
 await db.auth.signOut();
 mostrarPainel(false);
 limparFormulario();
 msg('Você saiu do painel.');
};
db.auth.onAuthStateChange(()=>{});
verificarSessao();
</script>
</body>
</html>
